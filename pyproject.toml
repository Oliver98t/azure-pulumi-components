[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-pulumi-components"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-azure-native>=3.0.0,<4.0.0",
]

[dependency-groups]
test = [
    "azure-monitor-opentelemetry>=1.8.11,<2",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulumi_components", "pulumi_components.*"]
